services:
  api:
    build: .
    container_name: fastapi_test_app

    command: sh -c "alembic upgrade head && pytest -v"

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    env_file:
      - .env.test

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17

    container_name: postgres_test_db

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastapi_test_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_test_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data: